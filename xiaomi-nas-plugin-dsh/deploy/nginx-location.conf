# dsh (DeepSeek Harness) Nginx 反代规则
# 兼容 /plugin/<NAS_UID>/dsh/... 与 /plugin/u<NAS_UID>/dsh/...
# 兼容桌面端 Windows 盘符前缀（/D:/plugin/...）与子路径 (/index.html/...)

location ~ ^(?:/[a-zA-Z]:)?/plugin/u?__NAS_UID__/dsh/(?:index\.html)?$ {
    if ($http_authorization != "") {
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header Set-Cookie "token=$http_authorization; Path=/; HttpOnly; Secure" always;
    }
    if ($arg_token != "") {
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header Set-Cookie "token=$arg_token; Path=/; HttpOnly; Secure" always;
    }
    rewrite ^ / break;
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3080;
    proxy_set_header Cookie "dsh-auth-VPhEEcLKeqRDBoBalzN2Nm7CnfxKhLE00pKIDWxt1sw=v1.eyJ2ZXJzaW9uIjoxLCJhdXRob3JpdHkiOiIxMjcuMC4wLjE6MzA4MCIsImlzc3VlZEF0IjoxNzkzMzUzODg1MTExLCJleHBpcmVzQXQiOjE3OTU1MTM4ODUxMTF9.NAXi-cFsS_ICRN44ey5dBobOMQi0Qn5BJaI6eSBpRU8; $http_cookie";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
}

location ~ ^(?:/[a-zA-Z]:)?/plugin/u?__NAS_UID__/dsh/(?:index\.html/)?(.*)$ {
    if ($http_authorization != "") {
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header Set-Cookie "token=$http_authorization; Path=/; HttpOnly; Secure" always;
    }
    if ($arg_token != "") {
        add_header 'Access-Control-Allow-Credentials' "true" always;
        add_header Set-Cookie "token=$arg_token; Path=/; HttpOnly; Secure" always;
    }
    rewrite ^(?:/[a-zA-Z]:)?/plugin/u?__NAS_UID__/dsh/(?:index\.html/)?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3080;
    proxy_set_header Cookie "dsh-auth-VPhEEcLKeqRDBoBalzN2Nm7CnfxKhLE00pKIDWxt1sw=v1.eyJ2ZXJzaW9uIjoxLCJhdXRob3JpdHkiOiIxMjcuMC4wLjE6MzA4MCIsImlzc3VlZEF0IjoxNzkzMzUzODg1MTExLCJleHBpcmVzQXQiOjE3OTU1MTM4ODUxMTF9.NAXi-cFsS_ICRN44ey5dBobOMQi0Qn5BJaI6eSBpRU8; $http_cookie";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}
